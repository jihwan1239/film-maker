<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#55101F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="흥행제작소">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>흥행제작소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: arcade cabinet in a theater. Red marquee sign, film-strip screen for the pixel office,
   clapper slate for the current film, chunky pixel tab buttons, ticket-style bottom sheets.
   Every frame uses notched pixel corners (offset box-shadows). Single deliberate look, no dark switch. */
:root{
  --ink:#231A2B; --ink2:#3B2D47; --ink3:#56456A;
  --paper:#FFF5DA; --paper2:#F8E5B0; --paper3:#E2C47F;
  --red:#E2434C; --red-d:#A62A37; --red-l:#FF8A8C;
  --gold:#F7C948; --gold-d:#C48A22; --gold-l:#FFE89A;
  --teal:#33AEA3; --teal-d:#1E7A73; --teal-l:#8FE3D8;
  --pink:#F27BA5; --pink-l:#FFD0E0; --mint-l:#CFF3EC; --butter-l:#FFEFA8;
  --muted:#7B6670;
  --curtain:#55101F; --curtain2:#741B2F; --curtain3:#93283F;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pixel:"DotGothic16","Jua","Apple SD Gothic Neo",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--curtain);
  background-image:linear-gradient(180deg,rgba(0,0,0,.35),transparent 140px),
    repeating-linear-gradient(90deg,var(--curtain) 0,var(--curtain2) 9px,var(--curtain3) 15px,var(--curtain2) 21px,var(--curtain) 30px);
  color:var(--ink); font-family:var(--body); font-size:15px; position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.valance{position:absolute;left:0;right:0;top:0;height:20px;pointer-events:none;
  background:radial-gradient(circle at 50% 0,var(--curtain3) 0 9px,var(--ink) 9px 11px,transparent 11.5px) 0 0/24px 20px repeat-x,
    linear-gradient(var(--gold-d),var(--gold-d)) 0 0/100% 3px no-repeat}
.app{max-width:460px;margin:0 auto;padding-block:22px 10px;display:flex;flex-direction:column;gap:12px;position:relative;min-height:100%;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal-l);outline-offset:3px}
img.ic{width:18px;height:18px;image-rendering:pixelated;display:inline-block;vertical-align:middle;flex:none}

/* pixel frames: notched corners */
.fr{margin:4px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 10px 0 0 rgba(20,6,14,.45)}
.fr2{margin:2px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}

/* marquee */
.marquee{background:var(--red);padding:16px 12px 16px;position:relative;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 10px 0 0 rgba(20,6,14,.45),inset 0 3px 0 0 var(--red-l),inset 0 -3px 0 0 var(--red-d)}
.marquee::before,.marquee::after{content:"";position:absolute;left:8px;right:8px;height:6px;
  background:radial-gradient(circle,#FFFBE0 0 1.4px,var(--gold) 1.8px 2.6px,transparent 3px) 0 0/12px 6px repeat-x,
    radial-gradient(circle,var(--gold-d) 0 2.2px,transparent 2.8px) 6px 0/12px 6px repeat-x;
  animation:chase 1.2s steps(1) infinite}
.marquee::before{top:5px}.marquee::after{bottom:5px;animation-delay:-.6s}
@keyframes chase{50%{background-position:6px 0,0 0}}
.mq-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.studio{font-family:var(--display);font-size:25px;line-height:1.15;color:var(--gold-l);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 2px 4px;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 4px var(--ink)}
.ctrl{display:flex;gap:6px;flex:none}
.ctrl button{width:28px;height:28px;display:grid;place-items:center;background:var(--paper);margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -3px 0 0 var(--paper3),0 4px 0 0 var(--red-d)}
.ctrl button img{width:14px;height:14px;image-rendering:pixelated}
.ctrl button[aria-pressed="true"]{background:var(--ink);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 2px 0 0 #000;transform:translateY(2px)}
.hud{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);padding:3px 9px 3px 6px;font-family:var(--pixel);font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -2px 0 0 var(--ink3);margin:2px}
.pill img{width:14px;height:14px;image-rendering:pixelated}
.pill.money{color:var(--gold-l)}.pill.money.neg{color:var(--red-l)}

/* screen with film strip */
.scene{background:#120C17;padding:8px 18px;position:relative;flex:1 0 auto;display:flex;flex-direction:column}
.scene::before,.scene::after{content:"";position:absolute;top:8px;bottom:8px;width:8px;
  background:repeating-linear-gradient(180deg,var(--ink3) 0 6px,transparent 6px 12px)}
.scene::before{left:5px}.scene::after{right:5px}
.screen{position:relative;box-shadow:0 0 0 2px #000;overflow:hidden;flex:1 0 auto;aspect-ratio:4/3;max-height:calc(min(460px,100vw) * 1.6)}
.screen canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,0);font-family:var(--display);font-size:12px;line-height:16px;padding:0 4px;white-space:nowrap;margin:2px;background:#fff;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);animation:up 1.15s ease-out forwards}
.bub.fun{background:var(--pink-l)}.bub.craft{background:var(--mint-l)}.bub.buzz{background:var(--butter-l)}.bub.cash{background:var(--gold)}
@keyframes up{0%{opacity:0;translate:0 6px}15%{opacity:1;translate:0 0}75%{opacity:1}100%{opacity:0;translate:0 -16px}}
#toasts{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--paper);padding:3px 9px;font-size:12.5px;font-family:var(--display);margin:2px;animation:tin .25s ease-out;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),0 4px 0 0 rgba(0,0,0,.35)}
.toast.gold{background:var(--gold)}.toast.red{background:#FFC6C6}
@keyframes tin{from{transform:translateY(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub,.toast,.sheet,.marquee::before,.marquee::after{animation:none!important}}

/* slate (status) */
.panel{background:var(--paper);padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;position:relative;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 10px 0 0 rgba(20,6,14,.45),inset 0 -4px 0 0 var(--paper3);margin:4px}
.panel::before{content:"";display:block;height:14px;margin:0 -14px 0;background:repeating-linear-gradient(-45deg,var(--ink) 0 9px,var(--paper) 9px 18px);border-bottom:4px solid var(--ink)}
.st-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st-title{font-family:var(--display);font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.st-sub .pix{color:var(--ink)}
.chip{display:inline-block;font-family:var(--display);font-size:12px;line-height:18px;padding:0 7px;background:#fff;white-space:nowrap;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.chip.g{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.bar{height:16px;background:var(--ink);padding:3px;margin:2px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--teal-l) 0 7px,var(--teal) 7px 9px);transition:width .3s steps(4)}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pt{display:flex;align-items:center;gap:5px;padding:4px 6px;font-size:12.5px;font-family:var(--display);margin:2px;min-width:0;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -3px 0 0 rgba(0,0,0,.1)}
.pt b{font-family:var(--pixel);font-weight:400;margin-left:auto;font-size:14px}
.pt img{width:14px;height:14px;image-rendering:pixelated}
.pt.fun{background:var(--pink-l)}.pt.craft{background:var(--mint-l)}.pt.buzz{background:var(--butter-l)}
.muted{color:var(--muted);font-size:13px}
.pix{font-family:var(--pixel);font-variant-numeric:tabular-nums}
.ticker{background:var(--ink);color:var(--paper);padding:6px 9px;display:flex;flex-direction:column;gap:4px;font-size:13px;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.ticker .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ticker .row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticker .row .pix{color:var(--gold-l)}
.ticker .lamp{display:inline-block;width:6px;height:6px;background:var(--red);margin-right:6px;box-shadow:0 0 0 1px #000;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:var(--red-d)}}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;background:var(--paper);font-family:var(--display);font-size:14px;margin:3px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 7px 0 0 rgba(20,6,14,.5),inset 0 3px 0 0 #fff,inset 0 -4px 0 0 var(--paper3)}
.tab img{width:22px;height:22px;image-rendering:pixelated}
.tab.main{background:var(--gold);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 7px 0 0 rgba(20,6,14,.5),inset 0 3px 0 0 var(--gold-l),inset 0 -4px 0 0 var(--gold-d)}
.tab:active{transform:translateY(4px);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}

/* buttons */
.btn{white-space:nowrap;background:var(--gold);font-family:var(--display);font-size:16px;padding:8px 12px;margin:3px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 6px 0 0 rgba(20,6,14,.35),inset 0 3px 0 0 rgba(255,255,255,.5),inset 0 -4px 0 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 3px 0 0 rgba(0,0,0,.15)}
.btn.red{background:var(--red);color:#fff;text-shadow:0 2px 0 var(--red-d)}.btn.teal{background:var(--teal);color:#fff;text-shadow:0 2px 0 var(--teal-d)}.btn.plain{background:var(--paper)}
.btn:disabled{background:#DCD0BE;color:var(--muted);text-shadow:none;cursor:not-allowed;transform:none}
.btn.sm{font-size:13px;padding:3px 9px;margin:2px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -3px 0 0 rgba(0,0,0,.18)}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(25,10,20,.62)}
.sheet{position:relative;width:100%;max-width:480px;max-height:88%;display:flex;flex-direction:column;background:var(--paper);animation:sup .22s ease-out;
  background-image:radial-gradient(rgba(35,26,43,.07) 1px,transparent 1.3px);background-size:8px 8px;
  box-shadow:0 -4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes sup{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--gold);position:relative;
  box-shadow:inset 0 3px 0 0 var(--gold-l),inset 0 -3px 0 0 var(--gold-d)}
.sheet-h::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:radial-gradient(circle at 6px 0,var(--gold-d) 0 3px,transparent 3.5px) 0 0/12px 6px repeat-x}
.sheet-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;text-shadow:0 2px 0 var(--gold-l)}
#sheetBody{overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px}
h3{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:17px;display:flex;align-items:center;gap:6px}
h3::before{content:"";width:8px;height:8px;background:var(--red);box-shadow:0 0 0 2px var(--ink);flex:none}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick{background:#fff;font-family:var(--display);font-size:14px;padding:7px 2px 6px;position:relative;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -3px 0 0 rgba(0,0,0,.09)}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--gold-l);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 2px 0 0 #000}
.pick:disabled{background:#EDE3D0;color:#AE9F95;cursor:not-allowed}
.pick .st{display:block;font-size:10px;color:var(--red);line-height:1;margin-top:3px;font-family:var(--pixel)}
.pick[aria-pressed="true"] .st{color:var(--gold)}
.card{background:#fff;padding:9px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;text-align:left;width:calc(100% - 4px);margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -3px 0 0 rgba(0,0,0,.07)}
.card[aria-pressed="true"]{background:var(--butter-l);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 0 0 3px var(--gold)}
.card:disabled{background:#F1E8D8;color:var(--muted);cursor:not-allowed}
.card:disabled .av{opacity:.55}
.card .av{width:40px;height:40px;image-rendering:pixelated;flex:none;background:var(--paper2);margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -6px 0 0 var(--paper3)}
.card .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .nm{font-family:var(--display);font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .side{text-align:right;font-family:var(--pixel);font-size:13px;white-space:nowrap}
.sg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;padding-top:7px;border-top:2px dashed rgba(35,26,43,.18)}
.sr{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px}
.sl{flex:none;width:50px;color:var(--muted);white-space:nowrap}
.sb{flex:1;height:8px;background:#EFE6D3;position:relative;min-width:20px;box-shadow:0 0 0 2px var(--ink)}
.sb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.35) 9px 10px)}
.sr b{flex:none;width:20px;text-align:right;font-family:var(--pixel);font-weight:400;font-size:12px}
.card:disabled .sb i{filter:grayscale(.7)}
.stats{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px}
.stats span b{font-family:var(--pixel);font-weight:400}
.list{display:flex;flex-direction:column;gap:8px}
.grade{font-family:var(--pixel);font-size:12px;line-height:16px;padding:0 4px;background:var(--gold);margin:2px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.grade.S,.grade.P{background:var(--red);color:#fff}.grade.A{background:var(--pink)}.grade.B{background:var(--teal);color:#fff}
.sumtbl{display:flex;flex-direction:column;gap:4px;background:#fff;padding:10px;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.sumtbl div{display:flex;justify-content:space-between;gap:10px}
.sumtbl div span:last-child{font-family:var(--pixel);text-align:right}
.sumtbl .tot{border-top:2px dashed var(--ink);padding-top:5px;font-family:var(--display)}
.foot{display:flex;gap:10px;justify-content:space-between}
.foot .btn{flex:1}
.big{font-family:var(--display);font-size:30px;line-height:1.1}
.center{text-align:center}
.poster{padding:16px 12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:4px;align-items:center;margin:4px;position:relative;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 0 0 4px rgba(255,255,255,.25),inset 0 -6px 0 0 rgba(0,0,0,.2)}
.poster .t{font-family:var(--display);font-size:27px;text-align:center;text-wrap:balance}
.poster img{width:36px;height:36px;image-rendering:pixelated}
input[type=text]{box-sizing:border-box;font:inherit;font-family:var(--display);font-size:17px;padding:7px 9px;width:calc(100% - 4px);background:#fff;min-width:0;border:0;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 3px 0 0 rgba(0,0,0,.08)}
.row2{display:flex;gap:8px;align-items:center}
.row2 input{flex:1}
.note{background:var(--paper2);padding:8px 10px;font-size:13px;margin:2px;box-shadow:0 -2px 0 0 var(--gold-d),0 2px 0 0 var(--gold-d),-2px 0 0 0 var(--gold-d),2px 0 0 0 var(--gold-d)}
.stars{color:var(--red);font-family:var(--pixel)}
.dex{display:flex;flex-direction:column;gap:8px}
.dex .g{display:flex;gap:8px;align-items:flex-start}
.dex .g>.chip{flex:none;min-width:52px;text-align:center}
.dex .ts{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:8px;background:#fff;margin:2px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.steps i.on{background:var(--red)}
.film{background:#fff;padding:9px;display:flex;flex-direction:column;gap:5px;margin:2px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 6px 0 0 0 var(--gc,var(--gold))}
.film>*{padding-left:6px}

const SKIN=['#F6D2B0','#EDC09A','#D9A27A'];
const BODY=['#F27BA5','#2FA79E','#F5C542','#9C7BE0','#FF8F3A','#6FA54E','#4F7BD9','#E0434B'];

const LEG_DIR=[{name:'뽕준호',dir:96,plan:82,fav:['스릴러','드라마','SF']},{name:'빡찬욱',dir:94,plan:80,fav:['스릴러','드라마','사극']},{name:'뉴승완',dir:88,plan:70,fav:['액션','코미디']},{name:'채동훈',dir:87,plan:78,fav:['액션','판타지','코미디']},{name:'이짱동',dir:92,plan:85,fav:['드라마']}];
const LEG_WRI=[{name:'킴은숙',write:92,plan:80,fav:['로맨스','드라마']},{name:'김은휘',write:93,plan:84,fav:['스릴러','호러','사극']},{name:'박해용',write:90,plan:78,fav:['드라마','코미디']}];
const LEG_ACT=[['쏭강호','M',97,92,['드라마','스릴러','코미디']],['마둥석','M',82,96,['액션','코미디']],['이빙헌','M',94,90,['액션','스릴러','사극']],['황정밍','M',93,88,['액션','드라마','스릴러']],['전지횬','F',85,94,['로맨스','판타지','액션']],['김혜쑤','F',93,90,['스릴러','드라마','코미디']],['손예찐','F',90,91,['로맨스','드라마']],['공유기','M',86,93,['로맨스','판타지','SF']],['정우썽','M',85,89,['액션','드라마']],['하쩡우','M',90,87,['스릴러','드라마','코미디']],['김태뤼','F',92,88,['사극','SF','드라마']],['이쩡재','M',88,90,['액션','스릴러']]];
const GRADE={D:{req:0,pop:[10,30],act:[15,40],fee:[3000,6000]},C:{req:22,pop:[25,45],act:[30,55],fee:[8000,15000]},B:{req:40,pop:[40,65],act:[45,70],fee:[20000,35000]},A:{req:58,pop:[60,80],act:[60,85],fee:[40000,70000]},S:{req:75,pop:[78,90],act:[75,92],fee:[80000,120000]},P:{req:85}};
const GRADE_LABEL={D:'D',C:'C',B:'B',A:'A',S:'S',P:'S+'};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtMoney(n){if(!Math.round(n))return '0원';const s=n<0?'-':'';n=Math.abs(Math.round(n));const e=Math.floor(n/10000),m=n%10000;if(e&&m)return s+e+'억 '+m.toLocaleString()+'만';if(e)return s+e+'억';return s+m.toLocaleString()+'만';}
function fmtAud(n){n=Math.round(n);if(n>=10000)return (n/10000).toFixed(n>=1e6?0:1)+'만명';return n.toLocaleString()+'명';}
const comboLevel=(g,t)=>GREAT.has(g+'|'+t)?3:BAD.has(g+'|'+t)?0:(hash(g+t)%3===0?2:1);
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const randName=()=>pick(SURN)+pick(GIVEN);
const makeTitle=t=>pick(TITLE_T).replace('{t}',t);

/* ---------- state ---------- */
let G=null;let H=120;
const UI={sheet:null,wiz:null,camp:0,confirm:null,avatars:{}};

function look(){return{hair:pick(HAIR),skin:pick(SKIN),body:pick(BODY),long:Math.random()<.45}}
function mkPerson(role,opt={}){
  const p={id:G.nextId++,name:opt.name||randName(),role,lv:1,exp:0,stats:{},trait:opt.trait||pick(TRAITS)[0],mastery:{},parody:!!opt.parody,...look()};
  const base=opt.base??(15+G.fame*0.45);
  for(const s of ROLE_STATS[role])p.stats[s]=clamp(Math.round(base+rnd(0,38)),5,95);
  if(role==='staff'){const sp=pick(ROLE_STATS.staff);p.stats[sp]=clamp(p.stats[sp]+15,5,95)}
  if(opt.stats)Object.assign(p.stats,opt.stats);
  if(opt.fav)for(const g of opt.fav)p.mastery[g]=4;
  const avg=ROLE_STATS[role].reduce((a,s)=>a+p.stats[s],0)/ROLE_STATS[role].length;
  p.salary=opt.salary??(role==='staff'?Math.round(avg*7):role==='director'?Math.round(p.stats.dir*12):Math.round(p.stats.write*10));
  if(role==='director')p.acc='beret';if(role==='writer')p.acc='glasses';if(opt.parody)p.acc='shades';
  return p;
}
function mkOut(role,opt={}){
  const p={id:G.nextId++,name:opt.name||randName(),role,mastery:{},parody:!!opt.parody,stats:{},...look()};
  const key=role==='director'?'dir':'write';
  p.stats[key]=opt[key]??ri(25,72);p.stats.plan=opt.plan??ri(20,60);
  if(opt.fav)for(const g of opt.fav)p.mastery[g]=4;else p.mastery[pick(GENRES)]=ri(1,2);
  p.fee=opt.fee??Math.round(p.stats[key]*p.stats[key]*(role==='director'?11:9)/100)*100;
  p.fameReq=opt.fameReq||0;p.acc=opt.parody?'shades':role==='director'?'beret':'glasses';
  return p;
}
function mkActor(grade,opt={}){
  const g=GRADE[grade];const a={id:G.nextId++,grade,parody:!!opt.parody,...look()};
  if(opt.parody){a.name=opt.name;a.long=opt.sex==='F';a.act=opt.act;a.pop=opt.pop;a.apt=opt.apt;a.fee=ri(10,18)*10000;a.acc='shades'}
  else{a.name=randName();a.act=ri(...g.act);a.pop=ri(...g.pop);const g1=pick(GENRES);let g2=pick(GENRES);while(g2===g1)g2=pick(GENRES);a.apt=[g1,g2];a.fee=Math.round(ri(...g.fee)/100)*100}
  return a;
}
function newGame(studio,boss){
  G={v:1,started:true,over:false,studio,year:1,month:1,week:1,money:200000,fame:0,office:0,speed:1,nextId:1,
     staff:[],films:[],prod:null,pending:null,topics:[...TOPICS_START],combos:{},outDir:[],outWri:[],actors:[],recruits:[],
     trend:pick(GENRES),ottReq:null,awards:0,trophies:0,compT:0};
  const b=mkPerson('boss',{name:boss,base:30,salary:0,trait:'성실'});for(const s in b.stats)b.stats[s]=ri(28,36);b.acc='tie';G.staff.push(b);
  G.staff.push(mkPerson('staff',{base:24}));
  for(let i=0;i<7;i++)G.outDir.push(mkOut('director'));
  LEG_DIR.forEach(l=>G.outDir.push(mkOut('director',{...l,parody:true,fee:ri(10,20)*10000,fameReq:25})));
  for(let i=0;i<6;i++)G.outWri.push(mkOut('writer'));
  LEG_WRI.forEach(l=>G.outWri.push(mkOut('writer',{...l,parody:true,fee:ri(8,15)*10000,fameReq:25})));
  const dist={D:6,C:6,B:5,A:4,S:3};for(const k in dist)for(let i=0;i<dist[k];i++)G.actors.push(mkActor(k));
  LEG_ACT.forEach(([name,sex,act,pop,apt])=>G.actors.push(mkActor('P',{parody:true,name,sex,act,pop,apt})));
  refreshRecruits();save();
}
function refreshRecruits(){
  G.recruits=[];
  for(let i=0;i<4;i++){const r=Math.random();G.recruits.push(mkPerson(r<.6?'staff':r<.8?'director':'writer'))}
  if(G.fame>=50&&Math.random()<.12){
    const hired=new Set(G.staff.map(s=>s.name));
    const pool=[...LEG_DIR.map(l=>['director',l]),...LEG_WRI.map(l=>['writer',l])].filter(([,l])=>!hired.has(l.name));
    if(pool.length){const[role,l]=pick(pool);G.recruits[3]=mkPerson(role,{name:l.name,parody:true,fav:l.fav,stats:role==='director'?{dir:l.dir,plan:l.plan}:{write:l.write,plan:l.plan},salary:ri(30,50)*100})}
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
const RENAME={봉준호떡:'뽕준호',박찬국:'빡찬욱',류승완자:'뉴승완',최동훈제:'채동훈',이창동치미:'이짱동',김은숙면:'킴은숙',김은희망:'김은휘',박해영양제:'박해용',송강호두:'쏭강호',마동석쇠:'마둥석',이병헌혈:'이빙헌',황정민트:'황정밍',전지현미:'전지횬',김혜수박:'김혜쑤',손예진주:'손예찐',정우성게:'정우썽',하정우유:'하쩡우',김태리본:'김태뤼',이정재래시장:'이쩡재'};
function migrate(g){[g.actors,g.outDir,g.outWri,g.staff,g.recruits].forEach(a=>(a||[]).forEach(p=>{if(RENAME[p.name])p.name=RENAME[p.name]}));(g.films||[]).forEach(f=>['actorName','dirName','wriName'].forEach(k=>{if(RENAME[f[k]])f[k]=RENAME[f[k]]}));if(g.pending)['actorName','dirName','wriName'].forEach(k=>{if(RENAME[g.pending[k]])g.pending[k]=RENAME[g.pending[k]]});return g}

/* ---------- helpers ---------- */
const eff=(p,s)=>(p.stats[s]||0)+((s==='cast'&&p.trait==='인맥왕')||(s==='nego'&&p.trait==='협상의 달인')?15:0);

const castPower=()=>Math.round(maxStat('cast')+G.fame*0.3);
const findById=(arr,id)=>arr.find(x=>x.id===id);

const phaseOf=P=>{const p=P.w/P.weeks;return p<.3?'시나리오':p<.8?'촬영':'후반작업'};
const salaries=()=>G.staff.reduce((a,p)=>a+p.salary,0);
function seasonMult(g,t,m){
  if(m===7||m===8)return ['액션','SF','호러','판타지'].includes(g)?1.25:1.05;
  if(m===12)return ['로맨스','애니','판타지'].includes(g)?1.25:1;
  if(m===1||m===2||m===9||m===10)return (['코미디','드라마'].includes(g)||t==='가족')?1.2:1;
  if(m===3||m===4||m===11)return .85;return 1;
}
const seasonName=m=>m===7||m===8?'여름 성수기':m===12?'연말 시즌':(m<=2||m===9||m===10)?'명절 시즌':(m===3||m===4||m===11)?'비수기':'평시즌';
function ratingMult(f){if(f.rating==='all')return DARK.includes(f.genre)?.85:1.12;if(f.rating==='adult')return DARK.includes(f.genre)?.75:.62;return 1}
function estimate(f,camp){
  const Hh=f.H+CAMPAIGN[camp].h;const buzz=.5+2*(1-Math.exp(-Hh/120));
  const raw=200000*Math.pow(f.Q/45,1.6)*buzz*BUDGET[f.budget].reach*seasonMult(f.genre,f.topic,G.month)*(G.trend===f.genre?1.2:1)*ratingMult(f)*(.6+f.A*.06);
  return 2e7*(1-Math.exp(-raw/2e7));
}
function ottOffer(f){const m=G.ottReq&&G.ottReq.genre===f.genre;return Math.max(20000,Math.round(estimate(f,0)*.5*.55*(1+maxStat('nego')/200)*(m?1.6:1)/100)*100)}

function tick(){
  const fx=[];

  releaseWeek();
  if(G.month===12&&G.week===4)awards();
  G.week++;
  if(G.week>4){G.week=1;G.month++;if(G.month>12){G.month=1;G.year++;G.trend=pick(GENRES);toast(`${G.year}년차 시작! 올해의 유행 장르는 ${G.trend}`,'gold')}monthly()}

function idleWork(fx){
  let sum=0;
  G.staff.forEach((p,i)=>{const st=ROLE_STATS[p.role];const v=Math.round(st.reduce((a,s)=>a+p.stats[s],0)/st.length*2.4);sum+=v;if(Math.random()<.5)fx.push([i,'+'+v+'만','cash'])});
  G.money+=sum;
}
function prodWeek(fx){
  const P=G.prod,ph=phaseOf(P),D=ref(P.dir,'director'),Wr=ref(P.wri,'writer'),A=findById(G.actors,P.actorId);
  const m=p=>1+.08*Math.min(5,(p.mastery||{})[P.genre]||0);
  const craftB=G.office>=3?1.1:1;
  let tf=0,tc=0,tm=0;
  const add=(p,f,c,k,slot)=>{
    const r=rnd(.75,1.25);
    f*=r*(p.trait==='아이디어 뱅크'?1.2:1);c*=r*craftB*(p.trait==='완벽주의'?1.2:1);k*=(p.trait==='흥행 감각'?1.25:1);
    tf+=f;tc+=c;tm+=k;
    const best=Math.max(f,c,k*.4);
    if(best>=1&&slot!=null){if(best===f)fx.push([slot,'재미+'+Math.round(f),'fun']);else if(best===c)fx.push([slot,'완성+'+Math.round(c),'craft']);else fx.push([slot,'화제+'+Math.round(k*.6),'buzz'])}
  };
  const dirC=p=>{const d=p.stats.dir,k=m(p);return ph==='시나리오'?[d*.15,0]:ph==='촬영'?[d*.4*k,d*.8*k]:[d*.2*k,d*.3*k]};
  const wriC=p=>{const w=p.stats.write,k=m(p);return ph==='시나리오'?[w*.9*k,w*.3*k]:ph==='촬영'?[w*.15,0]:[0,0]};
  G.staff.forEach((p,i)=>{
    if(P.dir.type==='ex'&&p.id===P.dir.id){const[f,c]=dirC(p);add(p,f,c,0,i)}
    else if(P.wri.type==='ex'&&p.id===P.wri.id){const[f,c]=wriC(p);add(p,f,c,0,i)}
    else if(p.role==='staff'||p.role==='boss'){
      const f=ph==='시나리오'?eff(p,'plan')*.25:0, c=ph==='촬영'?p.stats.tech*.3:ph==='후반작업'?p.stats.tech*.6:0;
      add(p,f,c,p.stats.mkt,i);
    }else{add(p,ph==='시나리오'?p.stats.plan*.12:0,0,0,i)}
  });
  if(P.dir.type==='out'){const[f,c]=dirC(D);add(D,f,c,0,'vd')}
  if(P.wri.type==='out'){const[f,c]=wriC(Wr);add(Wr,f,c,0,'vw')}
  if(ph==='촬영'){const act=A.act*(A.apt.includes(P.genre)?1.2:1);add({},act*.4,act*.3,0,'va')}
  P.fun+=tf;P.craft+=tc;P.mk+=tm;P.w++;
  if(P.w>=P.weeks)finishProduction();
}
function finishProduction(){
  const P=G.prod,weeks=P.weeks,combo=comboLevel(P.genre,P.topic);
  const qraw=(P.fun+P.craft)/weeks;
  const fit=P.ppl!=='none'&&(PPL[P.ppl].fit.includes(P.topic)||P.genre==='코미디');
  let Q=100*(1-Math.exp(-qraw/170))*COMBO_MULT[combo]+BUDGET[P.budget].bonus+(fit?3:0);
  if(P.sequelOf)Q*=.95;Q=Math.max(5,Q);
  const craftQ=100*(1-Math.exp(-(P.craft/weeks)/90));
  const A=clamp(1+8.6*(1-Math.exp(-Q/60))+(combo-1.5)*.3+rnd(-.5,.5)-(P.ppl!=='none'&&!fit?.3:0),1,9.8);
  const C=clamp(1+8.4*(1-Math.exp(-craftQ/45))+(P.rating==='adult'&&DARK.includes(P.genre)?.4:0)+rnd(-.8,.8),1,9.8);
  const actor=findById(G.actors,P.actorId);const D=ref(P.dir,'director'),Wr=ref(P.wri,'writer');
  const Hh=(P.mk/weeks)*.6+actor.pop+P.buzz+(P.sequelOf?30:0)+(G.office>=2?10:0);
  G.pending={id:G.nextId++,title:P.title,genre:P.genre,topic:P.topic,combo,Q,A,C,H:Hh,budget:P.budget,rating:P.rating,ppl:P.ppl,sequelOf:P.sequelOf,
    actorId:actor.id,actorName:actor.name,dirName:D.name,wriName:Wr.name,dirId:D.id,wriId:Wr.id,dirEx:P.dir.type==='ex',wriEx:P.wri.type==='ex',cost:P.cost};
  [D,Wr].forEach(p=>{p.mastery[P.genre]=(p.mastery[P.genre]||0)+1});
  G.staff.forEach(p=>{p.exp+=Q*.5*(p.trait==='성실'?1.5:1);while(p.exp>=p.lv*40){p.exp-=p.lv*40;p.lv++;for(const s of ROLE_STATS[p.role])p.stats[s]=clamp(p.stats[s]+ri(2,6),1,99);if(p.salary)p.salary=Math.round(p.salary*1.08);toast(`${p.name} 레벨 업! Lv.${p.lv}`,'gold');sfx('level')}});
  G.prod=null;UI.camp=0;openSheet('release');save();
}
function releaseWeek(){
  G.films.filter(f=>f.status==='showing').forEach(f=>{
    let wk=f.wi===0?f.total*(1-f.d):f.last*f.d;
    if(f.aud+wk>f.total)wk=f.total-f.aud;
    let end=f.wi>=14||wk<3000;
    if(wk<0)wk=0;
    f.aud+=wk;f.rev+=wk*.5;G.money+=wk*.5;f.last=wk;f.wi++;
    let comp=0;for(let i=0;i<4;i++)if(10000*Math.exp(gauss()*.9+2.6)>wk)comp++;
    f.rank=comp+1;
    if(f.wi===1){toast(`${f.title} 개봉! 관객 평점 ${f.A.toFixed(1)} / 평론가 ${f.C.toFixed(1)}`,'gold');if(f.luckMsg)toast(f.luckMsg,f.luck>1?'gold':'red')}
    if(f.rank===1&&!f.no1){f.no1=true;toast(`${f.title} 박스오피스 1위!`,'gold');sfx('big');bubble(0,'1위!','cash')}
    for(const ms of [1e6,3e6,5e6,1e7])if(f.aud>=ms&&!f.ms.includes(ms)){f.ms.push(ms);toast(`${f.title} ${ms/1e4}만 관객 돌파!`,'gold');sfx('big')}
    if(end){
      f.status='done';f.profit=Math.round(f.rev-f.cost-f.campCost);
      const df=Math.round(Math.min(8,f.aud/1e6*1.5)+(f.A>=8?1:0)-(f.aud<300000?1:0));f.fameUp=df;G.fame=clamp(G.fame+df,0,100);
      const a=findById(G.actors,f.actorId);if(a)a.pop=clamp(a.pop+(f.aud>3e6?5:f.aud>1e6?2:0),0,99);
      UI.resultId=f.id;openSheet('result');sfx(f.profit>=0?'fanfare':'bad');
    }
  });
}

function sfx(n){if(!SND.ctx||!SND.sfx||SND.ctx.state!=='running')return;const t=SND.ctx.currentTime+.01;SFX[n].forEach(([m,d,dt,ty,v])=>tone(mf(m),t+dt,d,ty||'square',v||.09))}
// 32 eighth notes, C major, cheerful office loop
const MEL=[72,0,76,79,77,76,74,0, 72,74,76,0,74,0,67,0, 69,0,72,76,74,72,71,0, 72,74,72,71,69,0,67,0,
           76,0,79,84,83,79,77,0, 76,77,79,0,77,0,72,0, 74,0,77,81,79,77,76,74, 72,0,67,0,72,0,0,0];
const BAS=[48,55,53,48,45,52,43,50, 48,55,53,48,50,53,43,48];
function startBgm(){
  if(!SND.ctx||SND.timer)return;SND.next=SND.ctx.currentTime+.1;
  SND.timer=setInterval(()=>{const c=SND.ctx;const spb=60/116/2;
    while(SND.next<c.currentTime+.2){const i=SND.step%MEL.length;
      if(MEL[i])tone(mf(MEL[i]),SND.next,spb*.9,'square',.09,SND.bg);
      if(i%4===0)tone(mf(BAS[(i/4)%BAS.length]),SND.next,spb*3.6,'triangle',.28,SND.bg);
      if(i%2===1)tone(2400,SND.next,.02,'square',.015,SND.bg);
      SND.next+=spb;SND.step++}
  },60);
}
function stopBgm(){clearInterval(SND.timer);SND.timer=null}
document.addEventListener('pointerdown',()=>{if(SND.bgm||SND.sfx)audioInit()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend();else if(SND.bgm||SND.sfx)SND.ctx.resume()});

const WIZ=[
  ()=>{const w=UI.wiz;return['1. 장르와 소재',stepsBar(0)+`
    <h3>장르</h3><div class="grid5">${GENRES.map(g=>`<button class="pick" data-act="wgenre" data-v="${g}" aria-pressed="${w.genre===g}">${g}${G.trend===g?'<span class="st">유행</span>':''}</button>`).join('')}</div>
    <h3>소재</h3><div class="grid5">${[...TOPICS_START,...TOPICS_LOCKED].map(t=>{const un=G.topics.includes(t);const k=G.combos[w.genre+'|'+t];return `<button class="pick" data-act="wtopic" data-v="${t}" aria-pressed="${w.topic===t}" ${un?'':'disabled'}>${un?t:'???'}${k!=null?`<span class="st">${stars(k)}</span>`:''}</button>`}).join('')}</div>
    <div class="muted">잠긴 소재는 기획 능력이 좋은 직원이 회의에서 찾아내요.</div>
    <h3>제목</h3><div class="row2"><input type="text" id="titleIn" maxlength="16" value="${esc(w.title)}"><button class="btn sm" data-act="wtitle">다시 짓기</button></div>
    ${wizFoot(w.genre&&w.topic&&w.title.trim())}`]},
  ()=>{const w=UI.wiz;const ex=G.staff.filter(p=>p.role==='director');
    return['2. 감독',stepsBar(1)+`${ex.length?`<h3>전속 감독</h3><div class="list">${ex.map(p=>personCard(p,{act:`data-act="wdir" data-type="ex" data-id="${p.id}"`,sel:w.dir&&w.dir.id===p.id,side:'추가 비용 없음',extra:masteryTxt(p,w.genre)})).join('')}</div>`:''}
    <h3>외주 감독</h3><div class="list">${G.outDir.map(p=>{const lock=G.fame<p.fameReq;return personCard(p,{act:`data-act="wdir" data-type="out" data-id="${p.id}"`,sel:w.dir&&w.dir.id===p.id,dis:lock,side:lock?`명성 ${p.fameReq} 필요`:fmtMoney(p.fee),extra:masteryTxt(p,w.genre)})}).join('')}</div>${wizFoot(!!w.dir)}`]},
  ()=>{const w=UI.wiz;const ex=G.staff.filter(p=>p.role==='writer');
    return['3. 작가',stepsBar(2)+`${ex.length?`<h3>전속 작가</h3><div class="list">${ex.map(p=>personCard(p,{act:`data-act="wwri" data-type="ex" data-id="${p.id}"`,sel:w.wri&&w.wri.id===p.id,side:'추가 비용 없음',extra:masteryTxt(p,w.genre)})).join('')}</div>`:''}
    <h3>외주 작가</h3><div class="list">${G.outWri.map(p=>{const lock=G.fame<p.fameReq;return personCard(p,{act:`data-act="wwri" data-type="out" data-id="${p.id}"`,sel:w.wri&&w.wri.id===p.id,dis:lock,side:lock?`명성 ${p.fameReq} 필요`:fmtMoney(p.fee),extra:masteryTxt(p,w.genre)})}).join('')}</div>${wizFoot(!!w.wri)}`]},
  ()=>{const w=UI.wiz;const cp=castPower();const list=[...G.actors].sort((a,b)=>(cp>=GRADE[b.grade].req)-(cp>=GRADE[a.grade].req)||(b.apt.includes(w.genre))-(a.apt.includes(w.genre))||b.pop-a.pop);
    return['4. 주연 배우',stepsBar(3)+`<div class="note">캐스팅 역량 <b class="pix">${cp}</b> · 장르 적성이 맞는 배우는 연기력이 20% 올라가요.</div><div class="list">${list.map(a=>actorCard(a,cp,`data-act="wactor" data-id="${a.id}"`,w.actor===a.id)).join('')}</div>${wizFoot(!!w.actor)}`]},
  ()=>{const w=UI.wiz;const cost=wizCost();const D=ref(w.dir,'director'),Wr=ref(w.wri,'writer'),A=findById(G.actors,w.actor);
    return['5. 규모와 등급',stepsBar(4)+`
    <h3>제작 규모</h3><div class="list">${Object.entries(BUDGET).map(([k,b])=>`<button class="card" data-act="wbudget" data-v="${k}" aria-pressed="${w.budget===k}"><span class="main"><span class="nm">${b.name}</span><span class="muted">${b.desc}</span></span><span class="side">${fmtMoney(b.cost)}</span></button>`).join('')}</div>
    <h3>관람 등급</h3><div class="grid4" style="grid-template-columns:repeat(3,1fr)">${Object.entries(RATING).map(([k,n])=>`<button class="pick" data-act="wrating" data-v="${k}" aria-pressed="${w.rating===k}">${n}</button>`).join('')}</div>
    <div class="muted">전체관람가는 관객층이 넓지만 어두운 장르와는 안 맞아요. 청불은 관객이 줄지만 호러와 스릴러는 평론가가 좋아해요.</div>
    <h3>PPL</h3><div class="grid4" style="grid-template-columns:repeat(3,1fr)">${Object.entries(PPL).map(([k,p])=>`<button class="pick" data-act="wppl" data-v="${k}" aria-pressed="${w.ppl===k}">${p.name}${p.support?`<span class="st">+${fmtMoney(p.support)}</span>`:''}</button>`).join('')}</div>
    <div class="muted">${w.ppl==='none'?'PPL을 넣으면 제작비를 지원받아요.':(PPL[w.ppl].fit.includes(w.topic)||w.genre==='코미디')?'이 영화엔 자연스럽게 녹아들어서 재미가 살짝 올라가요.':'영화와 안 어울려서 관객 평점이 살짝 깎일 수 있어요.'}</div>
    <div class="sumtbl"><div><span>${esc(w.title)}</span><span>${w.genre} × ${w.topic}</span></div>
    <div><span>감독 ${esc(D.name)}</span><span>${w.dir.type==='out'?fmtMoney(D.fee):'전속'}</span></div>
    <div><span>작가 ${esc(Wr.name)}</span><span>${w.wri.type==='out'?fmtMoney(Wr.fee):'전속'}</span></div>
    <div><span>주연 ${esc(A.name)}</span><span>${fmtMoney(A.fee)}</span></div>
    <div><span>${BUDGET[w.budget].name} 제작비</span><span>${fmtMoney(BUDGET[w.budget].cost)}</span></div>
    ${PPL[w.ppl].support?`<div><span>PPL 지원</span><span>-${fmtMoney(PPL[w.ppl].support)}</span></div>`:''}
    <div class="tot"><span>총 비용</span><span>${fmtMoney(cost)}</span></div><div><span>보유 자금</span><span>${fmtMoney(G.money)}</span></div></div>
    ${wizFoot(cost<=G.money,true)}`]},
];

/* ---------- actions ---------- */
const ACT={
  speed(d){G.speed=+d.v;renderHUD();save()},
  backdrop(){if(!LOCKED_SHEETS.includes(UI.sheet)&&UI.sheet!=='result'&&UI.sheet!=='awards')closeSheet()},
  close(){closeSheet()},
  tab(d){if(!G||G.over)return;
    if(d.v==='prod'){if(G.pending){openSheet('release');return}if(G.prod){openSheet('prodInfo');return}
      UI.wiz={step:0,genre:null,topic:null,title:'',dir:null,wri:null,actor:null,budget:'low',rating:'15',ppl:'none',sequelOf:null};openSheet('wizard');return}
    openSheet(d.v)},
  start(){const s=($('#inStudio').value||'').trim(),b=($('#inBoss').value||'').trim()||'김대표';if(!s){$('#introErr').hidden=false;$('#inStudio').focus();return}audioInit();newGame(s,b);sfx('fanfare');closeSheet();toast('제작 버튼을 눌러 첫 영화를 만들어보세요!','gold')},
  restart(){try{localStorage.removeItem(KEY)}catch(e){}G=null;UI.avatars={};$('#fx').innerHTML='';openSheet('intro')},
  rename(){const v=($('#renameIn').value||'').trim();if(!v)return;G.studio=v;renderHUD();toast(`영화사 이름을 ${v}로 바꿨어요`,'gold');save()},
  sndBgm(){SND.bgm=!SND.bgm;audioInit();SND.bgm?startBgm():stopBgm();sndSave();renderSheet();renderHUD()},
  sndSfx(){SND.sfx=!SND.sfx;audioInit();sndSave();sfx('click');renderSheet();renderHUD()},
  mute(){audioInit();const on=!(SND.bgm||SND.sfx);SND.bgm=on;SND.sfx=on;on?startBgm():stopBgm();sndSave();renderHUD()},
  askreset(){UI.confirm='reset';renderSheet()},
  wgenre(d){const w=UI.wiz;w.genre=d.v;if(w.topic&&!w.title)w.title=makeTitle(w.topic);renderSheet()},
  wtopic(d){const w=UI.wiz;const old=w.topic;w.topic=d.v;if(!w.title||(old&&w.title.includes(old)))w.title=makeTitle(d.v);renderSheet()},
  wtitle(){const w=UI.wiz;if(w.topic)w.title=makeTitle(w.topic);renderSheet()},
  wnext(){UI.wiz.step++;renderSheet();$('#sheetBody').scrollTop=0},
  wprev(){UI.wiz.step--;renderSheet();$('#sheetBody').scrollTop=0},
  wdir(d){UI.wiz.dir={type:d.type,id:+d.id};renderSheet()},
  wwri(d){UI.wiz.wri={type:d.type,id:+d.id};renderSheet()},
  wactor(d){UI.wiz.actor=+d.id;renderSheet()},
  wbudget(d){UI.wiz.budget=d.v;renderSheet()},
  wrating(d){UI.wiz.rating=d.v;renderSheet()},
  wppl(d){UI.wiz.ppl=d.v;renderSheet()},
  wstart(){const w=UI.wiz;const cost=wizCost();if(cost>G.money)return;G.money-=cost;
    G.prod={title:w.title.trim(),genre:w.genre,topic:w.topic,dir:w.dir,wri:w.wri,actorId:w.actor,budget:w.budget,rating:w.rating,ppl:w.ppl,sequelOf:w.sequelOf,weeks:BUDGET[w.budget].weeks,w:0,fun:0,craft:0,mk:0,buzz:0,cost};
    UI.wiz=null;closeSheet();toast(`${G.prod.title} 크랭크인!`,'gold');sfx('level');save()},
  camp(d){UI.camp=+d.v;renderSheet()},
  theater(){const f=G.pending;const c=CAMPAIGN[UI.camp];G.money-=c.cost;
    const e=estimate(f,UI.camp);let luck,msg='';const r=Math.random();
    if(r<.07){luck=.45;msg=pick(['개봉 주에 초대형 경쟁작과 맞붙었어요... 쪽박의 기운','개봉 직전 스포일러가 퍼져버렸어요'])}
    else if(r>.93){luck=2.1;msg=pick(['명장면이 SNS 밈이 되어 역주행 중!','입소문이 터져 N차 관람 열풍!'])}
    else luck=Math.exp(gauss()*.18);
    Object.assign(f,{status:'showing',total:Math.round(e*luck),d:clamp(.3+f.A*.055,.3,.86),wi:0,aud:0,rev:0,last:0,ms:[],luck,luckMsg:msg,campCost:c.cost,year:G.year,month:G.month});
    G.combos[f.genre+'|'+f.topic]=f.combo;G.films.push(f);G.pending=null;
    if(G.ottReq&&G.ottReq.genre===f.genre)toast('극장 개봉을 택해 OTT 의뢰는 그대로 남아있어요');
    closeSheet();toast(`${f.title} 다음 주 개봉!`,'gold');sfx('fanfare');save()},
  ott(){const f=G.pending;const off=ottOffer(f);const m=G.ottReq&&G.ottReq.genre===f.genre;
    G.money+=off;Object.assign(f,{status:'ott',rev:off,aud:0,campCost:0,profit:off-f.cost,year:G.year,month:G.month,ottRank:clamp(Math.round(11-f.Q/10+rnd(-1,1)),1,10)});
    f.fameUp=1+(f.A>=8?1:0);G.fame=clamp(G.fame+f.fameUp,0,100);if(m)G.ottReq=null;
    G.combos[f.genre+'|'+f.topic]=f.combo;G.films.push(f);G.pending=null;UI.resultId=f.id;openSheet('result');sfx('coin');save()},
  hire(d){const p=G.recruits.find(x=>x.id===+d.id);if(!p)return;const fee=p.salary*3;if(fee>G.money||G.staff.length>=OFFICE[G.office].cap)return;
    G.money-=fee;G.staff.push(p);G.recruits=G.recruits.filter(x=>x!==p);toast(`${p.name} 입사! 환영해요`,'gold');sfx('hire');renderSheet();renderHUD();save()},
  askfire(d){UI.confirm=+d.id;renderSheet()},
  fire(d){const id=+d.id;if(G.prod&&((G.prod.dir.type==='ex'&&G.prod.dir.id===id)||(G.prod.wri.type==='ex'&&G.prod.wri.id===id))){toast('제작 중인 영화의 감독이나 작가는 내보낼 수 없어요','red');UI.confirm=null;renderSheet();return}
    G.staff=G.staff.filter(p=>p.id!==id);UI.confirm=null;renderSheet();renderHUD();save()},
  repost(){if(G.money<300)return;G.money-=300;refreshRecruits();renderSheet();renderHUD()},
  upgrade(){const n=OFFICE[G.office+1];if(!n||G.money<n.cost)return;G.money-=n.cost;G.office++;toast(`${n.name}로 이사했어요!`,'gold');sfx('big');renderSheet();renderHUD();save()},
  sequel(d){const f=G.films.find(x=>x.id===+d.id);if(!f)return;const mt=f.title.match(/^(.*?)\s*(\d+)$/);
    const title=mt&&+mt[2]<10?mt[1]+' '+(+mt[2]+1):f.title+' 2';
    UI.wiz={step:1,genre:f.genre,topic:f.topic,title,dir:null,wri:null,actor:null,budget:f.budget,rating:f.rating,ppl:'none',sequelOf:f.id};openSheet('wizard')},
};
const QUIET=new Set(['start','hire','theater','ott','wstart','upgrade','sndSfx','mute','sndBgm']);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(!f)return;if(!QUIET.has(b.dataset.act))sfx('click');f(b.dataset,b)});
document.addEventListener('input',e=>{if(e.target.id==='titleIn'&&UI.wiz){UI.wiz.title=e.target.value;const nb=document.querySelector('[data-act="wnext"]');if(nb)nb.disabled=!(UI.wiz.genre&&UI.wiz.topic&&UI.wiz.title.trim())}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save()});

/* ---------- loop ---------- */
let acc=0,last=performance.now();
function loop(now){
  const dt=Math.min(500,now-last);last=now;
  if(G&&!UI.sheet&&!G.over&&G.speed>0){acc+=dt*SPEEDS[G.speed];while(acc>=WEEK_MS){acc-=WEEK_MS;tick();if(UI.sheet){acc=0;break}}}
  draw(now);requestAnimationFrame(loop);
}
function start(data){
  G=(data&&data.G)||load();
  if(G&&G.over)G=null;
  if(G){renderHUD();if(G.pending)openSheet('release')}else{openSheet("intro")}
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.__snd=SND;
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
window.__game={get G(){return G},tick:()=>tick(),ACT,UI};
})();
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
